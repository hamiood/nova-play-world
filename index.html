<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#050712">
<title>NOVA — Digital Arcade</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

html,body{
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#050712;
  color:#fff;
}

body{overflow-x:hidden}

button{
  font:inherit;
  border:0;
  cursor:pointer;
  color:inherit;
}

.hidden{display:none!important}

:root{
  --bg:#050712;
  --panel:#0b1020;
  --panel2:#11182c;
  --line:#202a45;
  --cyan:#50eaff;
  --purple:#8666ff;
  --muted:#7d89a7;
}

body{
  background:
  radial-gradient(circle at 80% -10%,#252050 0,transparent 28%),
  radial-gradient(circle at -10% 40%,#10243d 0,transparent 25%),
  #050712;
}

.app{
  min-height:100vh;
  padding-bottom:90px;
}

/* HEADER */

.header{
  height:72px;
  width:min(1150px,calc(100% - 32px));
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:900;
  letter-spacing:5px;
}

.logo span{color:var(--cyan)}

.status{
  color:#71809e;
  font-size:8px;
  letter-spacing:2px;
}

.status i{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#42edaa;
  box-shadow:0 0 12px #42edaa;
  margin-right:6px;
}

/* MAIN */

.container{
  width:min(1150px,calc(100% - 32px));
  margin:auto;
}

/* HOME */

.hero{
  min-height:430px;
  border:1px solid var(--line);
  border-radius:30px;
  padding:55px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 85% 30%,#4032a0 0,transparent 20%),
    radial-gradient(circle at 70% 80%,#173a58 0,transparent 30%),
    linear-gradient(135deg,#11172c,#080b16);
  box-shadow:0 30px 100px #0008;
}

.hero:before{
  content:"";
  position:absolute;
  width:300px;
  height:300px;
  right:-80px;
  top:-100px;
  border-radius:50%;
  border:1px solid #ffffff14;
  box-shadow:0 0 100px #5d55ff44;
}

.eyebrow{
  color:var(--cyan);
  font-size:8px;
  font-weight:800;
  letter-spacing:3px;
}

.hero h1{
  margin-top:18px;
  font-size:clamp(55px,9vw,100px);
  line-height:.82;
  letter-spacing:-6px;
}

.hero h1 span{color:var(--cyan)}

.hero p{
  max-width:460px;
  margin-top:25px;
  color:var(--muted);
  line-height:1.7;
  font-size:13px;
}

.primary{
  margin-top:30px;
  height:56px;
  padding:0 9px 0 24px;
  border-radius:16px;
  background:linear-gradient(100deg,var(--purple),var(--cyan));
  display:inline-flex;
  align-items:center;
  gap:20px;
  font-weight:900;
  box-shadow:0 15px 50px #5b5aff40;
}

.primary b{
  width:40px;
  height:40px;
  display:grid;
  place-items:center;
  background:#ffffff20;
  border-radius:12px;
  font-size:20px;
}

.section{
  margin-top:50px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}

.section-title h2{font-size:20px}

.section-title span{
  color:#56627f;
  font-size:8px;
  letter-spacing:2px;
}

.feature{
  width:100%;
  border:1px solid var(--line);
  border-radius:24px;
  overflow:hidden;
  background:var(--panel);
  text-align:left;
  transition:.2s;
}

.feature:hover{
  transform:translateY(-3px);
  border-color:#50eaff55;
}

.art{
  height:240px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#4237aa 0,transparent 13%),
    radial-gradient(circle at 75% 20%,#172f65 0,transparent 25%),
    #050712;
}

.art:after{
  content:"";
  position:absolute;
  inset:0;
  background-image:
    radial-gradient(circle,#fff 1px,transparent 1px),
    radial-gradient(circle,#fff 1px,transparent 1px);
  background-size:90px 90px,140px 140px;
  opacity:.3;
}

.planet{
  position:absolute;
  width:130px;
  height:130px;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:
    radial-gradient(circle at 30% 25%,#c4c6ff,#6557c9 40%,#15142f 78%);
  box-shadow:0 0 90px #6257ff66;
}

.ring{
  position:absolute;
  width:250px;
  height:70px;
  left:50%;
  top:53%;
  transform:translate(-50%,-50%) rotate(-15deg);
  border:2px solid #60edff66;
  border-radius:50%;
}

.ship-preview{
  position:absolute;
  z-index:2;
  left:50%;
  top:48%;
  transform:translate(-50%,-50%);
  font-size:45px;
  color:#dfffff;
  filter:drop-shadow(0 0 20px var(--cyan));
}

.feature-info{
  padding:24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.tag{
  color:var(--cyan);
  font-size:7px;
  letter-spacing:2px;
}

.feature-info h3{
  margin-top:7px;
  font-size:23px;
}

.feature-info p{
  margin-top:7px;
  color:var(--
