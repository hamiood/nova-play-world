<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050711">
<title>NOVA Play World</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:#050711;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
button{font:inherit;cursor:pointer}
.hidden{display:none!important}

/* BACKGROUND */
body:before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  background:
    radial-gradient(circle at 80% 10%,#3830a044,transparent 30%),
    radial-gradient(circle at 10% 50%,#00d9ff18,transparent 28%),
    linear-gradient(135deg,#050711,#090d1c 55%,#050711);
}
body:after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  opacity:.18;
  background-image:
    radial-gradient(#fff 1px,transparent 1px);
  background-size:70px 70px;
}

/* HEADER */
header{
  width:min(1180px,calc(100% - 30px));
  height:76px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.logo{
  font-size:23px;
  font-weight:900;
  letter-spacing:5px;
}
.logo span{color:#4eeaff}
.online{
  font-size:9px;
  color:#76819c;
  letter-spacing:2px;
}
.dot{
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#4cffac;
  box-shadow:0 0 14px #4cffac;
  margin-right:6px;
}

/* LAYOUT */
main{
  width:min(1180px,calc(100% - 30px));
  margin:auto;
  padding-bottom:120px;
}
.page{animation:fade .35s ease}
@keyframes fade{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:none}
}

/* HERO */
.hero{
  min-height:520px;
  padding:65px;
  border:1px solid #252d47;
  border-radius:32px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 78% 40%,#5448c855,transparent 20%),
    radial-gradient(circle at 70% 80%,#00cce622,transparent 28%),
    linear-gradient(135deg,#11172b,#080b16);
  box-shadow:0 35px 100px #0008;
}
.hero:before{
  content:"";
  position:absolute;
  width:360px;
  height:360px;
  right:-110px;
  top:-100px;
  border:1px solid #ffffff16;
  border-radius:50%;
  box-shadow:0 0 100px #675bff22;
}
.hero small{
  color:#4eeaff;
  font-size:9px;
  letter-spacing:3px;
  font-weight:bold;
}
.hero h1{
  margin-top:20px;
  font-size:clamp(58px,9vw,108px);
  line-height:.82;
  letter-spacing:-7px;
}
.hero h1 span{color:#4eeaff}
.hero p{
  max-width:480px;
  margin-top:28px;
  color:#8590aa;
  line-height:1.8;
  font-size:13px;
}
.play{
  margin-top:32px;
  border:0;
  border-radius:15px;
  padding:16px 22px;
  color:white;
  font-weight:900;
  background:linear-gradient(100deg,#6956ff,#35dff5);
  box-shadow:0 15px 45px #4b56ff44;
}
.play:hover{transform:translateY(-2px)}
.play span{margin-left:18px;font-size:20px}

/* SECTION */
.section{
  margin-top:45px;
}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:16px;
}
.section-head h2{font-size:21px}
.section-head small{
  color:#66718d;
  font-size:8px;
  letter-spacing:2px;
}

/* FEATURE */
.feature{
  border:1px solid #252d47;
  border-radius:25px;
  overflow:hidden;
  background:#0a0f1d;
  cursor:pointer;
}
.feature-art{
  height:250px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 50%,#443bb1,transparent 15%),
    radial-gradient(circle at 20% 30%,#103d62,transparent 25%),
    #040711;
}
.planet{
  position:absolute;
  width:135px;
  height:135px;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:radial-gradient(circle at 30% 25%,#e3e5ff,#6862d0 45%,#16162f);
  box-shadow:0 0 100px #6860ff77;
}
.ring{
  position:absolute;
  width:290px;
  height:80px;
  left:50%;
  top:52%;
  transform:translate(-50%,-50%) rotate(-14deg);
  border:2px solid #54eaff66;
  border-radius:50%;
}
.ship{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  font-size:48px;
  color:#eaffff;
  filter:drop-shadow(0 0 22px #4eeaff);
}
.feature-info{
  padding:25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.feature-info small{
  color:#4eeaff;
  font-size:8px;
  letter-spacing:2px;
}
.feature-info h3{
  margin-top:8px;
  font-size:24px;
}
.feature-info p{
  color:#77839f;
  font-size:11px;
  margin-top:7px;
}
.arrow{
  width:50px;
  height:50px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:#ffffff0a;
  font-size:22px;
}

/* PAGES */
.page-title{
  padding:40px 0 25px;
}
.page-title small{
  color:#4eeaff;
  letter-spacing:3px;
  font-size:8px;
}
.page-title h1{
  margin-top:12px;
  font-size:48px;
  letter-spacing:-3px;
}
.page-title p{
  color:#77839f;
  margin-top:7px;
  font-size:12px;
}

/* CARDS */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px;
}
.card{
  border:1px solid #252d47;
  border-radius:22px;
  overflow:hidden;
  background:#0a0f1d;
}
.cover{
  height:190px;
  display:grid;
  place-items:center;
  background:
    radial-gradient(circle,#443bb155,transparent 25%),
    linear-gradient(145deg,#10172c,#050711);
}
.cover-icon{
  font-size:65px;
  color:#4eeaff;
  filter:drop-shadow(0 0 25px #4eeaff);
}
.card-body{padding:22px}
.card-body small{
  color:#4eeaff;
  font-size:8px;
  letter-spacing:2px;
}
.card-body h3{
  margin-top:8px;
  font-size:20px;
}
.card-body p{
  margin-top:8px;
  color:#77839f;
  font-size:11px;
  line-height:1.6;
}
.card-btn{
  margin-top:18px;
  width:100%;
  height:44px;
  border:1px solid #293451;
  border-radius:12px;
  background:#11182b;
  color:#4eeaff;
  font-weight:bold;
}

/* LEADERBOARD */
.board{
  border:1px solid #252d47;
  border-radius:22px;
  overflow:hidden;
  background:#0a0f1d;
}
.row{
  min-height:75px;
  padding:0 22px;
  display:flex;
  align-items:center;
  gap:18px;
  border-bottom:1px solid #ffffff08;
}
.row:last-child{border:0}
.pos{
  width:30px;
  color:#68738d;
  font-weight:bold;
}
.player{flex:1;font-size:13px;font-weight:bold}
.score{
  color:#4eeaff;
  font-weight:bold;
}

/* PROFILE */
.profile{
  padding:35px;
  text-align:center;
  border:1px solid #252d47;
  border-radius:25px;
  background:#0a0f1d;
}
.avatar{
  width:85px;
  height:85px;
  margin:auto;
  border-radius:25px;
  display:grid;
  place-items:center;
  font-size:34px;
  background:linear-gradient(145deg,#39317d,#123348);
  box-shadow:0 0 55px #6358ff33;
}
.profile h2{margin-top:16px}
.profile p{margin-top:6px;color:#77839f;font-size:11px}
.stats{
  margin-top:30px;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}
.stat{
  padding:18px 5px;
  background:#060a14;
  border:1px solid #202a42;
  border-radius:15px;
}
.stat small{
  display:block;
  color:#68738d;
  font-size:7px;
}
.stat strong{
  display:block;
  margin-top:7px;
  color:#4eeaff;
  font-size:18px;
}

/* SETTINGS */
.settings{
  display:grid;
  gap:12px;
}
.setting{
  width:100%;
  min-height:70px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  text-align:left;
  color:white;
  background:#0a0f1d;
  border:1px solid #252d47;
  border-radius:18px;
}
.setting b{font-size:12px}
.setting small{
  display:block;
  color:#77839f;
  margin-top:5px;
  font-size:9px;
}
.chevron{color:#65718d;font-size:22px}

/* NAV */
.nav{
  position:fixed;
  z-index:50;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  width:min(550px,calc(100% - 20px));
  height:70px;
  padding:7px;
