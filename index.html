<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050611">
<title>NOVA PLAY</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:#050611;color:#fff;font-family:Arial,sans-serif}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.app{width:min(100%,560px);min-height:100vh;margin:auto;padding:18px 15px 100px}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 15%,#242052,#090a18 45%,#03040a 100%)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.logo{font-size:22px;font-weight:900;letter-spacing:-1px}
.logo span{color:#31dcff}
.avatar{width:42px;height:42px;border-radius:14px;background:#15192d;border:1px solid #292e4a}
.hero{padding:24px 20px;border-radius:28px;background:linear-gradient(145deg,#1c1c42,#090b18);border:1px solid #34345c;box-shadow:0 25px 70px #0008}
.tag{font-size:8px;letter-spacing:2px;color:#6deaff;font-weight:bold}
h1{font-size:43px;line-height:.9;margin:10px 0;letter-spacing:-3px}
h1 span{color:#39ddff}
p{color:#858da8;font-size:11px;line-height:1.6}
.points{margin-top:18px;padding:14px;border-radius:16px;background:#080a17}
.points small{display:block;color:#737d9e;font-size:8px}
.points strong{font-size:28px;display:block;margin-top:4px}
.play{width:100%;height:56px;margin-top:15px;border-radius:17px;background:linear-gradient(100deg,#754eff,#16dfff);font-weight:900;font-size:13px;box-shadow:0 12px 35px #6355ff55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stat{padding:13px 5px;text-align:center;border-radius:16px;background:#0e1122;border:1px solid #20253c}
.stat b{display:block;font-size:17px}.stat small{display:block;color:#707a99;font-size:7px;margin-top:5px}
.title{margin:25px 2px 12px;font-size:20px;font-weight:900}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{min-height:145px;padding:15px;border-radius:20px;text-align:left;background:linear-gradient(145deg,#181b38,#090b18);border:1px solid #252a45}
.card:first-child{grid-column:span 2;min-height:180px}
.card .art{height:100px;border-radius:15px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 50%,#40359b,#080a18 60%)}
.ship{position:absolute;left:42%;top:32%;font-size:42px;filter:drop-shadow(0 0 15px #27ddff)}
.card h3{font-size:14px;margin:10px 0 4px}.card p{margin:0}
.missions{display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:center;gap:10px;padding:13px;border-radius:16px;background:#0e1122;border:1px solid #20253c}
.mission .ico{font-size:20px}.mission div{flex:1}.mission b{color:#5fe7ff;font-size:10px}.mission strong{display:block;font-size:11px}.mission small{color:#737d9b;font-size:8px}
.hidden{display:none!important}

/* GAME */
#game{position:fixed;inset:0;background:#02030a;z-index:20}
.gameHead{height:65px;display:flex;align-items:center;padding:10px 15px;gap:12px}
.back{width:42px;height:42px;border-radius:13px;background:#171a30;font-size:24px}
.gameHead div{flex:1}.gameHead small{display:block;color:#727b99;font-size:7px}.gameHead b{display:block;font-size:14px;margin-top:3px}
#arena{position:absolute;left:10px;right:10px;top:75px;bottom:20px;border-radius:26px;overflow:hidden;border:1px solid #36345d;background:radial-gradient(circle at 50% 35%,#17154a,#050713 65%,#010207)}
#canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none}
.hud div{padding:8px 11px;border-radius:12px;background:#050611aa;border:1px solid #ffffff12}
.hud small{display:block;color:#737d9c;font-size:6px}.hud b{font-size:14px}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px;background:#02030acc}
.overlay .big{font-size:65px;filter:drop-shadow(0 0 20px #29dcff)}
.overlay h2{font-size:32px;line-height:.9;margin:10px 0}.overlay h2 span{color:#32ddff}
.overlay p{max-width:270px}
.overlay button{width:100%;max-width:300px;height:55px;border-radius:16px;background:linear-gradient(100deg,#754eff,#16dfff);font-weight:900}
.result{display:flex;gap:8px;width:100%;max-width:300px;margin:15px 0}.result div{flex:1;padding:12px 5px;border-radius:12px;background:#15182c}.result small{display:block;color:#737c99;font-size:6px}.result b{display:block;margin-top:4px;color:#60e8ff}
</style>
</head>

<body>

<div class="bg"></div>

<div class="app" id="home">

<div class="top">
<div class="logo">NOVA<span>PLAY</span></div>
<button class="avatar">👤</button>
</div>

<section class="hero">
<div class="tag">✦ WELCOME TO NOVA</div>
<h1>PLAY.<br><span>RISE.</span></h1>
<p>Enter the arcade. Survive the void. Collect crystals and build your NOVA legacy.</p>

<div class="points">
<small>NOVA POINTS</small>
<strong id="points">0</strong>
</div>

<button class="play" onclick="openGame()">🚀 PLAY NOVA SURVIVE</button>
</section>

<div class="stats">
<div class="stat
