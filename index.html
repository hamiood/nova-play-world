<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050712">
<title>NOVA — Play World</title>

<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;
background:#050712;
color:#f7fbff;
font:14px Inter,Arial,sans-serif;
overflow-x:hidden
}
button,a{font:inherit}

.stars{
position:fixed;
inset:0;
z-index:-1;
background:
radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 1px),
radial-gradient(circle at 70% 35%,#fff 0 1px,transparent 1px),
radial-gradient(circle at 45% 80%,#fff 0 1px,transparent 1px);
background-size:170px 190px,230px 260px,300px 330px;
opacity:.28
}

header{
width:min(1180px,calc(100% - 30px));
height:78px;
margin:auto;
display:flex;
align-items:center;
justify-content:space-between
}

.brand{
color:#fff;
text-decoration:none;
font-size:24px;
font-weight:900;
letter-spacing:6px
}

.brand span,.eyebrow,.tag{color:#55eaff}

.status{
font-size:9px;
letter-spacing:2px;
color:#74809b
}

main{
width:min(1180px,calc(100% - 30px));
margin:auto;
padding-bottom:120px
}

.page{
display:none;
animation:enter .4s ease
}

.page.active{display:block}

@keyframes enter{
from{opacity:0;transform:translateY(10px)}
to{opacity:1;transform:none}
}

.hero{
min-height:590px;
border:1px solid #28314b;
border-radius:32px;
padding:70px;
display:grid;
grid-template-columns:1fr 1fr;
gap:30px;
overflow:hidden;
position:relative;
background:
radial-gradient(circle at 72% 48%,#6158ff38,transparent 20%),
linear-gradient(135deg,#10162a,#070a15);
box-shadow:0 30px 100px #0008
}

.hero h1{
font-size:clamp(58px,8vw,106px);
line-height:.84;
letter-spacing:-7px;
margin:20px 0
}

.hero h1 span{
color:#55eaff;
text-shadow:0 0 40px #55eaff44
}

.lead{
max-width:510px;
color:#8591ac;
line-height:1.8
}

.eyebrow{
font-size:9px;
letter-spacing:3px;
font-weight:800
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-top:28px
}

.btn{
border:0;
border-radius:13px;
padding:14px 19px;
font-weight:800;
font-size:11px;
cursor:pointer
}

.btn b{
margin-left:16px;
font-size:17px
}

.primary{
color:#fff;
background:linear-gradient(100deg,#6b57ff,#42e5f5);
box-shadow:0 15px 40px #4c5aff33
}

.ghost{
color:#b9c5df;
background:#ffffff08;
border:1px solid #2b3652
}

.scene{
min-height:430px;
position:relative;
display:grid;
place-items:center
}

.planet{
width:210px;
height:210px;
border-radius:50%;
background:
radial-gradient(circle at 30% 25%,#fff,#7d77e0 35%,#15162f 75%);
box-shadow:0 0 100px #635cff77
}

.orbit{
position:absolute;
border:1px solid #55eaff44;
border-radius:50%
}

.orbit.a{
width:470px;
height:135px;
transform:rotate(-18deg)
}

.orbit.b{
width:350px;
height:350px;
border-color:#725dff33
}

.ship{
position:absolute;
font-size:58px;
color:#eaffff;
filter:drop-shadow(0 0 22
